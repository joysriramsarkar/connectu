name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Test Production Build
        run: npm run build
        env:
          NEXT_IGNORE_INCORRECT_LOCKFILE: "1"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/testdb"
          NEXT_PUBLIC_FIREBASE_API_KEY: "dummy-key-for-ci-build"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "connectu-ci.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "connectu-ci"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "connectu-ci.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789:web:abcdef"
          JWT_SECRET: "ci_jwt_test_secret_for_automated_builds_only"
